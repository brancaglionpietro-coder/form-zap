<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whatsapp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <img src="../icons/whatsapp.png" alt="whats" width="30px" height="auto">
        <h1>Empresa</h1>
    </nav>
    <main>
        <div id="msg">
            <p>Olá! Isira seus dados para ser direcionado para o Whatsapp:</p>
        </div>
        <div id="name">
            <h3>Seu nome</h3>
            <label for="nome"></label>
            <input type="text" placeholder="Digite seu nome" id="nome">
        </div>
        <div id="gmail">
            <h3>Seu e-mail</h3>
            <label for="nome"></label>
            <input type="text" placeholder="exemplo@email.com" id="email">
        </div>
        <div id="whats">
            <h3>Seu Whatsapp</h3>
            <label for="nome"></label>
            <input type="text" placeholder="+55(88)98888-8888" id="tel">
        </div>
        <div>
            <button>Ir para o Whatsapp</button>
        </div>
    </main>
    <footer>
        <p>Powered by Agendar</p>
    </footer>


    <script src="script.js"></script>
</body>
</html>
